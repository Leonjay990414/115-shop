name: zhiguang_app
description: "智光商工 115週年校慶園遊會 - 官方客製化紀念品原生 Android App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / UX Pro Max 設計系統與字體
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0

  # 音效與通知機制
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.1.2

  # Firebase 核心連線 (Firestore, Auth)
  firebase_core: ^2.30.1
  cloud_firestore: ^4.17.2

  # 網絡與應用更新
  http: ^1.2.1
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
